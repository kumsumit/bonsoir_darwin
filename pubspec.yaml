name: bonsoir_darwin
description: Darwin (iOS & macOS) implementation of the Bonsoir plugin.
homepage: https://bonsoir.skyost.eu
repository: https://github.com/Skyost/Bonsoir/tree/main/packages/bonsoir_darwin
issue_tracker: https://github.com/Skyost/Bonsoir/issues
version: 6.0.1
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: bonsoir
    platforms:
      ios:
        pluginClass: SwiftBonsoirPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SwiftBonsoirPlugin
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter
  bonsoir_platform_interface:
    git: https://github.com/kumsumit/bonsoir_platform_interface.git
